# ==============================================================
# InterviewPrep AI - Retrieval Evaluation Configuration
# ==============================================================

mlflow:
  tracking_uri: "http://136.109.222.133:5000"

evaluation:
  relevance_threshold: 1
  max_k: 15

bm25_defaults: &bm25_defaults
  search_column: "chunk_text"
  tsvector_column: "chunk_tsvector"
  search_language: "english"
  table: "document_chunks"
  chunk_id_column: "chunk_id"

configs:
  # --- Pure Vector ---
  - model_name: "sentence-transformers/all-MiniLM-L6-v2"
    embedding_dim: 384
    chunk_size: 512
    overlap_size: 64
    retrieval_mode: "vector"

  - model_name: "sentence-transformers/all-mpnet-base-v2"
    embedding_dim: 768
    chunk_size: 512
    overlap_size: 64
    retrieval_mode: "vector"

  # --- Pure BM25 ---
  - model_name: "bm25-baseline"
    embedding_dim: 0
    chunk_size: 512
    overlap_size: 64
    retrieval_mode: "bm25"
    bm25_config:
      <<: *bm25_defaults

  # --- Hybrid: MiniLM + BM25 ---
  - model_name: "sentence-transformers/all-MiniLM-L6-v2"
    embedding_dim: 384
    chunk_size: 512
    overlap_size: 64
    retrieval_mode: "hybrid"
    bm25_config:
      <<: *bm25_defaults
    hybrid_config:
      rrf_k: 60
      vector_weight: 0.5
      bm25_weight: 0.5
      vector_top_k: 30
      bm25_top_k: 30

  # --- Hybrid: mpnet + BM25 ---
  - model_name: "sentence-transformers/all-mpnet-base-v2"
    embedding_dim: 768
    chunk_size: 512
    overlap_size: 64
    retrieval_mode: "hybrid"
    bm25_config:
      <<: *bm25_defaults
    hybrid_config:
      rrf_k: 60
      vector_weight: 0.5
      bm25_weight: 0.5
      vector_top_k: 30
      bm25_top_k: 30