# ═══════════════════════════════════════════════════
# Entity Extraction Configuration
#
# All dictionaries, aliases, and keyword lists for
# extracting structured fields from interview content.
# Edit here — no code changes needed.
#
# Sections:
#   company_aliases          → Canonical name: [aliases...]
#   role_aliases             → Canonical role: [aliases...]
#   level_keywords           → Seniority: [keywords...]  (ORDER MATTERS)
#   interview_type_keywords  → Type: [keywords...]
#   round_patterns           → Regex list for detecting round headers
#   topic_keywords           → Topic: [keywords...]
#   outcome_keywords         → Outcome: [keywords...]  (ORDER MATTERS)
#   difficulty_keywords      → Level: [keywords...]  (ORDER MATTERS)
# ═══════════════════════════════════════════════════


# ─── Company Extraction Config ─────────────────────
# 3-tier approach: title regex → alias dictionary → spaCy ORG NER

company_extraction:

  # Tier 1: Title regex patterns
  # Named group (?P<company>...) captures the company name.
  # These match common interview title formats across platforms.
  # Order matters — more specific patterns first.
  title_patterns:
    # "Google Interview Experience for SDE"
    # "IBM Interview Experience for Storage Intern"
    - "^(?P<company>[\\w\\s.&\\-]+?)\\s+Interview\\s+Experience"

    # "Interview Experience at Google"
    # "My Interview Experience at IBM"
    - "Interview\\s+Experience\\s+(?:at|with|for)\\s+(?P<company>[\\w\\s.&\\-]+?)\\s*(?:for|\\-|\\||$)"

    # "My Google Interview" / "My Interview at IBM"
    - "(?:My|The)\\s+(?:Interview\\s+(?:at|with)\\s+)?(?P<company>[\\w\\s.&\\-]+?)\\s+Interview"

    # "SDE Interview at Google"
    - "Interview\\s+(?:at|with)\\s+(?P<company>[\\w\\s.&\\-]+?)\\s*(?:\\||\\-|$)"

    # "Interview Questions from Google" / "Google Hiring Process"
    - "(?:Interview\\s+Questions\\s+(?:from|at)|Hiring\\s+Process\\s+(?:at|of))\\s+(?P<company>[\\w\\s.&\\-]+)"

    # "Placed at Google" / "Selected at IBM"
    - "(?:Placed|Selected|Hired)\\s+(?:at|by|in)\\s+(?P<company>[\\w\\s.&\\-]+)"

  # Tier 3: spaCy ORG NER config
  ner:
    # spaCy model — only NER pipe is loaded
    model: "en_core_web_sm"

    # Blocklist: terms spaCy ORG NER commonly misclassifies.
    # These are NOT companies — they're technologies, platforms,
    # interview concepts, or generic terms that produce false
    # positives in interview text context.
    blocklist:
      # ── Technologies / frameworks ──
      - "python"
      - "java"
      - "javascript"
      - "react"
      - "angular"
      - "node.js"
      - "django"
      - "flask"
      - "spring"
      - "spring boot"
      - "docker"
      - "kubernetes"
      - "kafka"
      - "redis"
      - "hadoop"
      - "spark"
      - "terraform"
      - "jenkins"
      - "git"
      - "linux"
      - "windows"
      - "macos"
      - "android"
      - "ios"

      # ── Platforms / tools often misclassified ──
      - "leetcode"
      - "hackerrank"
      - "hackerearth"
      - "codeforces"
      - "geeksforgeeks"
      - "stackoverflow"
      - "stack overflow"
      - "github"
      - "medium"
      - "glassdoor"
      - "naukri"
      - "indeed"
      - "zoom"
      - "teams"
      - "google meet"
      - "webex"

      # ── Interview / academic terms ──
      - "dsa"
      - "oop"
      - "oops"
      - "dbms"
      - "sql"
      - "nosql"
      - "hr"
      - "os"
      - "api"
      - "rest"
      - "iit"
      - "nit"
      - "bits"

      # ── Generic org-like terms ──
      - "the company"
      - "our college"
      - "my college"
      - "the team"
      - "the firm"


